<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dict — HUD redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070f;
    --surface-0: #070a14;
    --surface-1: #0a0e1a;
    --surface-2: #0d1220;
    --line-dim: rgba(138, 149, 172, 0.12);
    --line-mid: rgba(138, 149, 172, 0.22);
    --line-hi:  rgba(205, 215, 235, 0.45);
    --text-hi: #e6edf7;
    --text-mid: #8a95ac;
    --text-dim: #4a5268;
    --cyan: #7be4ff;
    --cyan-deep: #2ea8c9;
    --amber: #ffb340;
    --amber-deep: #c47a14;
    --green: #6bffb3;
    --green-deep: #1fa36a;
    --violet: #c7a8ff;
    --violet-deep: #7a4fd1;
    --crimson: #ff4757;
    --crimson-deep: #b4202e;
    --accent: var(--cyan);
    --accent-deep: var(--cyan-deep);
    --rec-red: #ff4757;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #03040a; color: var(--text-hi); font-family: 'Rajdhani', sans-serif; -webkit-font-smoothing: antialiased; height: 100%; overflow: hidden; }
  #root { height: 100%; }
</style>
</head>
<body>
  <div id="root"></div>

  <script>
  // Tweakable defaults - persisted via __edit_mode_set_keys
  window.__TWEAKS = /*EDITMODE-BEGIN*/{
    "state": "rec",
    "accent": "cyan",
    "ringDensity": 54,
    "showWaveStrip": true,
    "showSettings": false,
    "showGrid": true,
    "transcriptLen": "empty"
  }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="./src/record-widget.jsx"></script>
  <script type="text/babel" src="./src/status-strip.jsx"></script>
  <script type="text/babel" src="./src/transcript.jsx"></script>
  <script type="text/babel" src="./src/header.jsx"></script>
  <script type="text/babel" src="./src/history.jsx"></script>
  <script type="text/babel" src="./src/settings.jsx"></script>
  <script type="text/babel" src="./src/tweaks.jsx"></script>
  <script type="text/babel" src="./src/app.jsx"></script>
</body>
</html>
